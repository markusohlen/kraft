<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Kraft's icon: a K drawn as a commit graph, a main line with two branches. Render to icon.png with `npm run icon`. -->
  <!-- A bright tile with a bold white K, so it still reads at title-bar size (16px) on both dark and light title bars. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="0.6" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="224" fill="url(#background)" />
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="124">
    <path d="M450 420C590 480 690 620 712 770" />
    <path d="M318 650C318 470 510 290 712 250" />
    <path d="M318 240V784" />
  </g>
  <!-- Solid commit dots: hollow rings blur into the tile at small sizes. -->
  <g fill="#ffffff">
    <circle cx="318" cy="232" r="100" />
    <circle cx="318" cy="792" r="100" />
    <circle cx="716" cy="244" r="100" />
    <circle cx="716" cy="780" r="100" />
  </g>
</svg>
